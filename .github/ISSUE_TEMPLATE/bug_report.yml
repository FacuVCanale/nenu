name: Bug report
description: Report reproducible incorrect behavior in Nenu
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove secrets, private pane output, usernames, hostnames, and source code from everything you submit. Security vulnerabilities belong in a private advisory.
  - type: checkboxes
    attributes:
      label: Safety check
      options:
        - label: This is not a security vulnerability or sensitive disclosure.
          required: true
        - label: I searched existing issues and discussions.
          required: true
  - type: input
    attributes:
      label: Nenu version
      description: Run `herdr plugin action invoke version --plugin herdr.nenu`.
      placeholder: 0.37.0+abcdef0
    validations:
      required: true
  - type: input
    attributes:
      label: Herdr version
      description: Run `herdr --version`.
      placeholder: herdr 0.9.4
    validations:
      required: true
  - type: input
    attributes:
      label: Environment
      description: Host OS, device and browser (say if Nenu runs as an installed PWA), install method, and deployment variant.
      placeholder: macOS 15, iPhone 15 iOS 18.6 installed PWA, linked clone, Tailscale Serve
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Give the smallest repeatable sequence.
      placeholder: |
        1. Open …
        2. Tap …
        3. Observe …
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and actual behavior
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Screenshot or recording
      description: Required for anything visible. Drag a screenshot here, or a short screen recording for a gesture, a flow or something that changes over time. Remove private data first.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Sanitized diagnostics
      description: Optional logs, screenshots, or build headers with private data removed.
      render: shell
