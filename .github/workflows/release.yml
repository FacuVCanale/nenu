name: Release

# Every pushed vX.Y.Z tag becomes a GitHub Release whose notes carry the update commands — the
# in-app update banner links here, so the page a user lands on tells them exactly how to update.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2

      - name: Verify release identity
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          manifest="$(awk -F '"' '/^version = / { print $2; exit }' herdr-plugin.toml)"
          test "$version" = "$manifest"
          bash scripts/check-version.sh
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd web && bun install --frozen-lockfile

      - name: Test and build release candidate
        run: |
          bun run test
          cd web && bun run test && cd ..
          bun run build

      - name: Assemble release notes (CHANGELOG section + update commands)
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/notes.md"
          # This version's CHANGELOG block: everything between its `## [x.y.z]` heading and the next.
          awk -v ver="$version" '
            $0 ~ ("^## \\[" ver "\\]") { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/changelog.md" || true
          {
            if [ -s "$RUNNER_TEMP/changelog.md" ]; then
              cat "$RUNNER_TEMP/changelog.md"
              echo
            fi
            echo "## Update"
            echo
            echo "Update the plugin — advances the checkout, rebuilds, restarts (runs from any directory):"
            echo
            echo '```'
            # A routine update stays inside its major (ADR 0020); crossing into x.0.0 takes update-major.
            case "$version" in
              *.0.0) echo "herdr plugin action invoke update-major --plugin herdr.nenu" ;;
              *) echo "herdr plugin action invoke update --plugin herdr.nenu" ;;
            esac
            echo '```'
            echo
            echo "Or just restart the bridge to pick up an already-built change:"
            echo
            echo '```'
            echo "herdr plugin action invoke restart --plugin herdr.nenu"
            echo '```'
          } > "$notes"
          echo "file=$notes" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Nenu $GITHUB_REF_NAME" --notes-file "${{ steps.notes.outputs.file }}"
